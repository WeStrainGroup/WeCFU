{% set name = "wecfu" %}
{% set version = "1.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Build only the reviewed release commit. Runtime data is never tracked.
  git_url: .
  git_rev: HEAD

build:
  number: 0
  noarch: python
  include_recipe: false   # don't embed the recipe+source into info/ (smaller)
  script:
    - "{{ PYTHON }} -m pip install . -vv --no-deps --ignore-installed"
    # pip records the local build directory; it is not product provenance.
    - "{{ PYTHON }} -c \"import pathlib, sysconfig; [p.unlink() for p in pathlib.Path(sysconfig.get_path('purelib')).glob('wecfu-*.dist-info/direct_url.json')]\""
  entry_points:
    - wecfu = wecfu.cli:main

requirements:
  host:
    - python >=3.12,<3.13
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.12,<3.13
    - numpy
    - scipy
    - scikit-image
    - py-opencv
    - pillow
    - pandas
    - fastapi
    - pydantic >=2,<3
    - uvicorn
    - python-multipart

test:
  imports:
    - wecfu
    - wecfu.cli
    - wecfu.plate
    - wecfu.segment
    - wecfu.pipeline
    - wecfu.server.app
  commands:
    - wecfu --help

about:
  home: https://github.com/WeStrainGroup/WeCFU
  license: CC-BY-NC-SA-4.0
  license_file: LICENSE
  summary: "WeCFU — a friendly, interactive, web-based colony counter for petri dish photos"
  description: |
    WeCFU is a local web tool for counting colonies on petri-dish photos.
    Review plate photos, correct colony markers, and export CSV or ZIP.
    The noarch package includes the interface and classical methods.
    Ultra uses the automatically prepared, isolated SAM runtime and verified model cache
    on macOS and Linux; see INSTALL.md. It never silently substitutes
    a classical result when a selected model is unavailable.

extra:
  recipe-maintainers:
    - WeStrainGroup
