{% set name = "wecfu" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Build only the reviewed release commit. Runtime data is never tracked.
  git_url: .
  git_rev: HEAD

build:
  number: 0
  noarch: python
  include_recipe: false   # don't embed the recipe+source into info/ (smaller)
  script:
    - "{{ PYTHON }} -m pip install . -vv --no-deps --ignore-installed"
    # pip records the local build directory; it is not product provenance.
    - "{{ PYTHON }} -c \"import pathlib, importlib.metadata as m; d = m.distribution('wecfu'); [pathlib.Path(d.locate_file(f)).unlink(missing_ok=True) for f in d.files or () if str(f).endswith('.dist-info/direct_url.json')]\""
  entry_points:
    - wecfu = wecfu.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.10
    - numpy
    - scipy
    - scikit-image
    - py-opencv
    - pillow
    - pandas
    - fastapi
    - pydantic >=2,<3
    - uvicorn
    - python-multipart

test:
  imports:
    - wecfu
    - wecfu.cli
    - wecfu.plate
    - wecfu.segment
    - wecfu.pipeline
    - wecfu.server.app
  commands:
    - wecfu --help

about:
  home: https://github.com/WeStrainGroup/WeCFU
  license: CC-BY-NC-SA-4.0
  license_file: LICENSE
  summary: "WeCFU — a friendly, interactive, web-based colony counter for petri dish photos"
  description: |
    WeCFU is a local web tool for counting colonies on petri-dish photos.
    Review plate photos, correct colony markers, and export CSV or ZIP.
    The noarch package includes the interface and classical methods.
    Fusion v2 uses the separately installed, pinned models extra and
    verified model cache; see INSTALL.md. It never silently substitutes
    a classical result when a selected model is unavailable.

extra:
  recipe-maintainers:
    - WeStrainGroup
