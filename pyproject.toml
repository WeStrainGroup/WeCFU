[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wecfu"
version = "1.2.1"
description = "WeCFU — a friendly, interactive, web-based colony counter for petri dish photos"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "WeF culturomics team" }]
license = { text = "CC-BY-NC-SA-4.0" }
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "opencv-python-headless",
    "pillow",
    "pandas",
    "fastapi",
    "pydantic>=2,<3",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "build"]
# The validated portable model runtime uses Python 3.12.
# Source and weights are installed separately by python -m wecfu.setup_models.
models = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "scikit-image==0.26.0",
    "opencv-python-headless==5.0.0.93",
    "pillow==13.0.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "huggingface-hub==0.36.2",
    "hydra-core==1.3.2",
    "omegaconf==2.3.1",
    "iopath==0.1.10",
    "tqdm==4.70.1",
    "safetensors==0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
wecfu = "wecfu.cli:main"

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
packages = ["wecfu", "wecfu.server", "wecfu.server.fusion_dino", "wecfu.experiments"]

[tool.setuptools.package-data]
"wecfu" = ["model_assets.json"]
"wecfu.server" = [
    "static/*.html", "static/*.js", "static/*.css",
    "fusion_filter_v2.json", "product_fusion_v2.json", "sam2_product_use.json",
]
"wecfu.server.fusion_dino" = [
    "configuration.json", "library-pins.json", "license-provenance.json",
    "loading-metadata.json", "runtime-contract.json",
]
